{% if versions %}
<label class="visually-hidden" for="release-switcher">Documentation version</label>
<select id="release-switcher" class="form-select" aria-label="Documentation version"
        onchange="window.location.href=this.value">
  {% for item in versions %}
  <option value="{{ item.url | e }}"{% if item.name == current_version.name %} selected{% endif %}>
    {{ item.name }}{% if not item.is_released %} (development){% endif %}
  </option>
  {% endfor %}
</select>
{% endif %}
