name: Documentation links

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  local-links:
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      DOCS_VERSION: latest
      DOCS_SOURCE_REF: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Build documentation for link tests
        run: python -m sphinx -W --keep-going -b html Documentation Documentation/_build/html
      - name: Check local links, anchors, assets, and comment extraction
        run: python -m unittest discover -s .github/scripts -p 'test_documentation_links.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: Documentation/_build/html
          if-no-files-found: error

  external-links:
    needs: local-links
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      DOCS_SOURCE_REF: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Check external links in guides, docstrings, and code comments
        run: python -m sphinx -W --keep-going -b linkcheck Documentation Documentation/_build/linkcheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-link-report
          path: Documentation/_build/linkcheck
          if-no-files-found: warn
