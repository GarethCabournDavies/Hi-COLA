name: Unit tests

on:
  push:
    branches: [Hi-COLA_public]
  pull_request:

permissions:
  contents: read

jobs:
  matrix:
    name: Load test matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github
      - id: matrix
        run: python3 .github/scripts/ci_matrix.py --os-mode primary

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    needs: matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # Optional versions report failures without failing the gate.
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    env:
      MPLBACKEND: Agg
      CODECOV_TOKEN_AVAILABLE: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e '.[tests]'
      - name: Run unit tests with coverage
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Generate coverage reports
        if: always()
        run: |
          python -m coverage report
          python -m coverage xml
          python -m coverage html
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
          if-no-files-found: error
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.primary && env.CODECOV_TOKEN_AVAILABLE == 'true' && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true

  unit-tests-ok:
    # Single required check for branch protection, independent of the matrix.
    name: Unit tests OK
    needs: [matrix, unit-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful unit tests
        run: |
          echo "matrix: ${{ needs.matrix.result }}, unit-tests: ${{ needs.unit-tests.result }}"
          test "${{ needs.matrix.result }}" = success
          test "${{ needs.unit-tests.result }}" = success
