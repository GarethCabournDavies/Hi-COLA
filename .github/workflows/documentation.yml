name: Documentation

on:
  pull_request:
    paths:
      - 'Documentation/**'
      - 'HiCOLA/Frontend/**'
      - 'HiCOLA/Utilities/**'
      - 'HiCOLA/__init__.py'
      - 'README.md'
      - 'Hi-COLA-*.png'
      - 'requirements*'
      - 'setup.py'
      - '.github/workflows/documentation.yml'
  push:
    paths:
      - 'Documentation/**'
      - 'HiCOLA/Frontend/**'
      - 'HiCOLA/Utilities/**'
      - 'HiCOLA/__init__.py'
      - 'README.md'
      - 'Hi-COLA-*.png'
      - 'requirements*'
      - 'setup.py'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      DOCS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DOCS_SOURCE_REF: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: |
            requirements-docs.lock
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.lock
      - name: Validate pull-request documentation
        if: github.event_name == 'pull_request'
        run: python -m sphinx -W --keep-going -b html Documentation Documentation/_build/html
      - name: Build default-branch and release-tag documentation
        if: github.event_name != 'pull_request'
        run: |
          sphinx-multiversion -W --keep-going Documentation Documentation/_build/html
          test -f "Documentation/_build/html/$DOCS_DEFAULT_BRANCH/index.html"
          printf '<!doctype html><html lang="en"><meta charset="utf-8"><title>Hi-COLA documentation</title><meta http-equiv="refresh" content="0;url=%s/"><a href="%s/">Hi-COLA documentation</a></html>\n' "$DOCS_DEFAULT_BRANCH" "$DOCS_DEFAULT_BRANCH" > Documentation/_build/html/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: Documentation/_build/html
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          path: Documentation/_build/html

  publish:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
