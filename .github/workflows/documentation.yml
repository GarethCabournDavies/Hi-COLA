name: Documentation

on:
  pull_request:
  push:
  workflow_run:
    workflows: [Documentation links]
    types: [completed]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      DOCS_VERSION: latest
      DOCS_SOURCE_REF: ${{ github.event.repository.default_branch }}
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Check publication logic
        run: python -m unittest discover -s .github/scripts -p 'test_docs_site.py' -v
      - name: Build guides and docstring reference
        run: python -m sphinx -W --keep-going -b html Documentation Documentation/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: Documentation/_build/html
          if-no-files-found: error

  publish:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: documentation-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      DOCS_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: documentation-html
          path: latest-build
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Read published releases and previous site
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPOSITORY/releases" --jq '.[]' | jq -s '.' > "$RUNNER_TEMP/releases.json"
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages
            git worktree add --detach "$RUNNER_TEMP/previous-docs" FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
      - name: Set canonical URL for the built development site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python .github/scripts/docs_site.py --rewrite-latest latest-build --site-url "$SITE_URL"
      - name: Preserve snapshots and build new release versions
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python .github/scripts/docs_site.py \
            --latest latest-build \
            --existing "$RUNNER_TEMP/previous-docs" \
            --destination "$RUNNER_TEMP/documentation-site" \
            --releases "$RUNNER_TEMP/releases.json" \
            --site-url "$SITE_URL"
      - name: Update gh-pages branch
        run: |
          cd "$RUNNER_TEMP/documentation-site"
          git init
          git checkout -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git -C "$GITHUB_WORKSPACE" show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git fetch "$GITHUB_WORKSPACE" refs/remotes/origin/gh-pages
            git reset --soft FETCH_HEAD
          fi
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Publish documentation for $DOCS_COMMIT" -m 'Co-authored-by: Codex <noreply@openai.com>'
            git -C "$GITHUB_WORKSPACE" fetch "$RUNNER_TEMP/documentation-site" gh-pages
            git -C "$GITHUB_WORKSPACE" push origin FETCH_HEAD:refs/heads/gh-pages
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/documentation-site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
